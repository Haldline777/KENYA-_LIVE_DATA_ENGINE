name: Kenya Daily Automation Engine

on:
  schedule:
    # Runs automatically every single day at midnight UTC (3:00 AM East Africa Time)
    - cron: '0 0 * * *'
  # Allows us to run it instantly by clicking a button whenever we want
  workflow_dispatch:

jobs:
  run-data-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Files
      uses: actions/checkout@v4

    - name: Initialize Python Setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Data Analysis Packages
      run: pip install requests pandas textblob

    - name: Execute Live Scraper Script
      run: python pipeline.py

    - name: Automatically Commit and Push to Track Activity
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add nairobi_climate_anomalies.csv
        git commit -m "system: automated daily data ingestion [skip ci]" || echo "No changes found"
        git push
